name: Zona
options:
  bundleIdPrefix: org.flightblog.zona
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true

# Explicit lowercase config names so per-config references (e.g. the target's
# `configFiles`) match. Without this XcodeGen defaults to Debug/Release.
configs:
  debug: debug
  release: release

packages:
  ZonaKit:
    path: ZonaKit

targets:
  Zona:
    type: application
    # Multiplatform: one target, both destinations.
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Zona
    dependencies:
      - package: ZonaKit
    info:
      path: Zona/Resources/Info.plist
      properties:
        CFBundleDisplayName: Zona
        UILaunchScreen: {}
        # Required: without this string CoreBluetooth cannot request permission
        # and the central manager reports .unauthorized.
        NSBluetoothAlwaysUsageDescription: >-
          Zona connects to your smart trainer and heart-rate monitor over
          Bluetooth to hold you in your chosen zone and show live heart rate.
        # Custom URL scheme for the Strava OAuth callback (zona://strava-auth).
        # Must match the redirect scheme in StravaOAuthConfig and the Strava API
        # app's Authorization Callback Domain.
        CFBundleURLTypes:
          - CFBundleURLName: org.flightblog.zona.strava
            CFBundleURLSchemes: [zona]
        # Strava client id/secret, injected from the gitignored Secrets.xcconfig
        # (see configFiles below). Empty when unconfigured on this machine, in
        # which case the Strava upload button hides itself.
        StravaClientID: $(STRAVA_CLIENT_ID)
        StravaClientSecret: $(STRAVA_CLIENT_SECRET)
    # Per-config xcconfig holding the Strava secrets. Gitignored — each developer
    # supplies their own from their Strava API app. Copy Secrets.example.xcconfig
    # to Zona/Config/Secrets.xcconfig and fill it in.
    configFiles:
      debug: Zona/Config/Secrets.xcconfig
      release: Zona/Config/Secrets.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.flightblog.zona
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        # Only iPhone/iPad + Mac; keep it simple for the prototype.
        TARGETED_DEVICE_FAMILY: "1,2"
        # App icon from Assets.xcassets/AppIcon.appiconset (iOS 1024 + full mac ladder).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    # macOS needs the sandbox + bluetooth entitlement; iOS relies on the
    # Info.plist usage string alone. XcodeGen owns this file — declare the keys
    # here so they survive regeneration (the harmless iOS sandbox keys are
    # ignored on iOS builds).
    entitlements:
      path: Zona/Resources/Zona.macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.bluetooth: true
        # Outbound HTTPS for the Strava upload. The sandboxed macOS build blocks
        # all networking without this; iOS needs no equivalent.
        com.apple.security.network.client: true
        # iCloud/CloudKit sync of the SwiftData store (rides follow the user
        # across iPhone/iPad/Mac). Requires the iCloud + Push Notifications
        # capabilities enabled on the App ID and a CloudKit container named
        # iCloud.org.flightblog.zona in the Apple Developer portal. The container
        # scope is declared in code (ZonaApp.modelContainer). aps-environment is
        # CloudKit's silent-push change-notification channel; XcodeGen/Xcode
        # flips it to `production` for release/archive builds.
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-identifiers: [iCloud.org.flightblog.zona]
        aps-environment: development
